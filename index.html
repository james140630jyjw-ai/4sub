<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Interactive Subtitle Switch Player</title>
  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #111;
      color: white;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    h1 {
      margin-top: 20px;
      margin-bottom: 10px;
    }

    .video-wrapper {
      position: relative;
      width: 90%;
      max-width: 800px;
      margin-top: 20px;
    }

    video {
      width: 100%;
      display: block;
      background: black;
      border-radius: 10px;
      position: relative;
      z-index: 1;
    }

    /* 💬 자막 터치 레이어: 재생바 위쪽 30%만 덮기 */
    #subtitle-touch-layer {
      position: absolute;
      left: 0;
      right: 0;
      bottom: 15%;   /* 맨 아래 15%는 컨트롤바용으로 비워둔다 */
      height: 30%;   /* 그 위 30%를 자막 터치 영역으로 사용 */
      z-index: 2;
      pointer-events: auto;
      /* 디버깅용
      background: rgba(0, 255, 0, 0.1);
      */
    }

    #uploader {
      margin-top: 25px;
      padding: 15px;
      background: #222;
      border-radius: 10px;
      text-align: center;
    }

    #uploader label {
      display: block;
      margin-bottom: 8px;
    }

    #uploader input {
      margin-bottom: 10px;
    }
  </style>
</head>

<body>
  <h1>Interactive Subtitle Switch Player</h1>

  <div class="video-wrapper">
    <video id="video" controls>
      <source src="sample/sample_teaser.mp4" type="video/mp4" />

      <!-- 기본: 한국어 자막 -->
      <track
        id="track-en"
        label="English"
        kind="subtitles"
        srclang="en"
        src="sample/sample_en.vtt"
      />

      <track
        id="track-ko"
        label="Korean"
        kind="subtitles"
        srclang="ko"
        src="sample/sample_ko.vtt"
        default
      />
    </video>

    <!-- 💬 자막 홀드/해제 영역 -->
    <div id="subtitle-touch-layer"></div>
  </div>

  <div id="uploader">
    <label>🎬 Upload Your Own Video</label>
    <input type="file" id="upload-video" accept="video/*" /><br />

    <label>🇺🇸 Upload English Subtitle (.vtt)</label>
    <input type="file" id="upload-en" accept=".vtt" /><br />

    <label>🇰🇷 Upload Korean Subtitle (.vtt)</label>
    <input type="file" id="upload-ko" accept=".vtt" />
  </div>

  <script src="script.js"></script>
</body>
</html>
