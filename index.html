<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Interactive Subtitle Switch Player</title>

<style>
  body {
    margin: 0;
    background: #111;
    color: white;
    font-family: Arial, sans-serif;
    display: flex;
    flex-direction: column;
    align-items: center;
  }

  h1 {
    margin-top: 25px;
  }

  /* 🎥 비디오 16:9 비율 고정 */
  .video-wrapper {
    position: relative;
    width: 90%;
    max-width: 800px;
    aspect-ratio: 16/9;  /* 🔥 Safari도 지원되는 최신 속성 */
    background: black;
    margin-top: 20px;
    border-radius: 12px;
    overflow: hidden;
  }

  video {
    width: 100%;
    height: 100%;
    object-fit: cover;  /* 비율 채우기 */
    position: absolute;
    top: 0;
    left: 0;
    z-index: 1;
  }

  /* ⛔ 영상 클릭 차단 (controls 바깥 영역 클릭 방지) */
  #video-click-blocker {
    position: absolute;
    left: 0;
    top: 0;
    width: 100%;
    height: 85%; /* 아래 15%만 비디오가 클릭 가능 */
    z-index: 2;
    pointer-events: auto;
    /* 디버깅용: background: rgba(255,0,0,0.1); */
  }

  /* 💬 자막 터치 레이어 */
  #subtitle-touch-layer {
    position: absolute;
    left: 0;
    width: 100%;
    bottom: 15%;   /* 컨트롤바 위 */
    height: 30%;   /* 자막 위치 */
    z-index: 3;
    pointer-events: auto;
    /* 디버깅: background: rgba(0,255,0,0.1); */
  }

  /* 🎛 재생바를 비디오 높이에 포함시키지 않고 오버레이로 띄움 */
  video::-webkit-media-controls-panel {
    position: absolute !important;
    bottom: 0 !important;
    height: 15% !important; /* 우리가 비워둔 영역 안에서만 표시됨 */
  }
</style>
</head>

<body>
<h1>Interactive Subtitle Switch Player</h1>

<div class="video-wrapper">

  <video id="video" controls>
    <source src="sample/sample_teaser.mp4" type="video/mp4" />

    <track id="track-en" label="English" kind="subtitles"
           srclang="en" src="sample/sample_en.vtt" />

    <track id="track-ko" label="Korean" kind="subtitles"
           srclang="ko" src="sample/sample_ko.vtt" default />
  </video>

  <div id="video-click-blocker"></div>

  <div id="subtitle-touch-layer"></div>

</div>

<script src="script.js"></script>
</body>
</html>
