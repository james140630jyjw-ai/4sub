<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Interactive Subtitle Player</title>

  <style>
    body {
      margin: 0;
      background: #111;
      color: white;
      font-family: Arial, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    h1 {
      margin-top: 24px;
      margin-bottom: 16px;
    }

    .video-wrapper {
      position: relative;
      width: 90%;
      max-width: 800px;
      aspect-ratio: 16 / 9;
      border-radius: 12px;
      overflow: hidden;
      background: black;
    }

    video {
      width: 100%;
      height: 100%;
      object-fit: cover;
      background: black;
    }

    /* 🔥 자막이 나오는 화면 하단 일부만 덮는 투명 터치 레이어
       - 맨 아래 컨트롤바(재생버튼, 타임라인)는 덮지 않도록 bottom을 올려둠
    */
    #subtitle-touch-overlay {
      position: absolute;
      left: 0;
      width: 100%;
      height: 20%;      /* 자막 라인 높이 대략 */
      bottom: 18%;      /* 컨트롤바 0~15% 정도로 보고 그 위만 덮기 */
      z-index: 5;
      pointer-events: auto;
      background: transparent;
      /* 디버깅용:
      background: rgba(0, 255, 0, 0.2);
      */
    }

    #uploader {
      margin-top: 20px;
      background: #222;
      padding: 16px;
      width: 90%;
      max-width: 800px;
      border-radius: 10px;
      box-sizing: border-box;
    }

    #uploader h2 {
      margin: 0 0 10px;
      font-size: 16px;
    }

    #uploader label {
      display: block;
      margin: 6px 0 2px;
    }

    #uploader input {
      width: 100%;
      margin-bottom: 8px;
    }
  </style>
</head>

<body>
  <h1>Interactive Subtitle Player</h1>

  <div class="video-wrapper">
    <video id="video" controls>
      <source src="sample/sample_teaser.mp4" type="video/mp4" />
      <track id="track-en" label="English" kind="subtitles" srclang="en" src="sample/sample_en.vtt">
      <track id="track-ko" label="Korean" kind="subtitles" srclang="ko" src="sample/sample_ko.vtt">
    </video>

    <!-- 자막 위 터치 레이어 -->
    <div id="subtitle-touch-overlay"></div>
  </div>

  <div id="uploader">
    <h2>Upload Video / Subtitles</h2>

    <label>🎬 Upload Video</label>
    <input type="file" id="upload-video" accept="video/*">

    <label>🇺🇸 Upload English Subtitle (.vtt)</label>
    <input type="file" id="upload-en" accept=".vtt">

    <label>🇰🇷 Upload Korean Subtitle (.vtt)</label>
    <input type="file" id="upload-ko" accept=".vtt">
  </div>

  <script src="script.js"></script>
</body>
</html>
