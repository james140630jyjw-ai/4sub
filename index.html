<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Interactive Subtitle Switch Player</title>

  <style>
    body {
      margin: 0;
      background: #111;
      color: white;
      font-family: Arial, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    h1 {
      margin-top: 24px;
      margin-bottom: 16px;
    }

    /* 🎥 16:9 비율 유지 */
    .video-wrapper {
      position: relative;
      width: 90%;
      max-width: 800px;
      aspect-ratio: 16 / 9;
      background: black;
      border-radius: 12px 12px 0 0;
      overflow: hidden;
    }

    video {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
      background: black;
    }

    /* 브라우저 기본 자막은 안 보이게 숨김 (우리는 직접 그릴 거라서) */
    video::cue {
      visibility: hidden;
    }

    /* 💬 영상 아래 자막 바 (여기를 눌러서 언어 전환) */
    #subtitle-bar {
      width: 90%;
      max-width: 800px;
      min-height: 2.4em;
      background: #000;
      border-radius: 0 0 12px 12px;
      margin-top: 0;
      padding: 6px 12px;
      box-sizing: border-box;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      font-size: 1rem;
      line-height: 1.4;
      color: #fff;
      text-shadow: 0 0 4px #000, 0 0 8px #000;
      cursor: pointer; /* 여기를 누른다는 힌트 */
      user-select: none;
    }

    #subtitle-bar span {
      background: rgba(0, 0, 0, 0.5);
      padding: 4px 8px;
      border-radius: 4px;
    }

    #hint {
      margin-top: 4px;
      font-size: 12px;
      color: #aaa;
    }

    #uploader {
      margin-top: 16px;
      padding: 16px;
      background: #222;
      border-radius: 10px;
      width: 90%;
      max-width: 800px;
      box-sizing: border-box;
      font-size: 14px;
    }

    #uploader h2 {
      margin: 0 0 10px;
      font-size: 16px;
    }

    #uploader label {
      display: block;
      margin: 6px 0 2px;
    }

    #uploader input[type="file"] {
      width: 100%;
      margin-bottom: 8px;
    }
  </style>
</head>

<body>
  <h1>Interactive Subtitle Switch Player</h1>

  <div class="video-wrapper">
    <video id="video" controls>
      <source src="sample/sample_teaser.mp4" type="video/mp4" />

      <!-- 데이터용 트랙 (우리가 읽어서 직접 그림) -->
      <track
        id="track-en"
        label="English"
        kind="subtitles"
        srclang="en"
        src="sample/sample_en.vtt"
      />
      <track
        id="track-ko"
        label="Korean"
        kind="subtitles"
        srclang="ko"
        src="sample/sample_ko.vtt"
      />
    </video>
  </div>

  <!-- 영상 아래 자막 표시 + 홀드 영역 -->
  <div id="subtitle-bar"><span></span></div>
  <div id="hint">자막 줄을 꾹 누르면 영어, 떼면 한국어로 돌아옵니다.</div>

  <div id="uploader">
    <h2>Use Your Own Video / Subtitles</h2>

    <label for="upload-video">🎬 Upload Video</label>
    <input type="file" id="upload-video" accept="video/*" />

    <label for="upload-en">🇺🇸 Upload English Subtitle (.vtt)</label>
    <input type="file" id="upload-en" accept=".vtt" />

    <label for="upload-ko">🇰🇷 Upload Korean Subtitle (.vtt)</label>
    <input type="file" id="upload-ko" accept=".vtt" />
  </div>

  <script src="script.js"></script>
</body>
</html>
