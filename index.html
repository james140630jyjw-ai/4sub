<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Interactive Subtitle Switch Player</title>

<style>
  body {
    margin: 0;
    background: #111;
    color: white;
    font-family: Arial, sans-serif;
    display: flex;
    flex-direction: column;
    align-items: center;
  }

  h1 {
    margin-top: 25px;
  }

  /* 🎥 16:9 비율 유지 */
  .video-wrapper {
    position: relative;
    width: 90%;
    max-width: 800px;
    aspect-ratio: 16 / 9;
    background: black;
    margin-top: 20px;
    border-radius: 12px;
    overflow: hidden;
  }

  video {
    width: 100%;
    height: 100%;
    object-fit: cover;
    position: absolute;
    top: 0;
    left: 0;
    z-index: 1;
  }

  /* ⛔ 영상 상단 85% 클릭 차단 → 영상이 멈추는 문제 방지 */
  #video-click-blocker {
    position: absolute;
    left: 0;
    top: 0;
    width: 100%;
    height: 85%;
    z-index: 2;
    pointer-events: auto;
  }

  /* 💬 자막 스위치 레이어 (영상 아래쪽 30%) */
  #subtitle-touch-layer {
    position: absolute;
    left: 0;
    width: 100%;
    bottom: 15%;
    height: 30%;
    z-index: 3;
    pointer-events: auto;
  }

  /* 🎛 Safari 영상 컨트롤바를 오버레이로 고정 */
  video::-webkit-media-controls-panel {
    position: absolute !important;
    bottom: 0 !important;
    height: 15% !important;
  }

</style>
</head>

<body>
<h1>Interactive Subtitle Switch Player</h1>

<div class="video-wrapper">

  <video id="video" controls>
    <source src="sample/sample_teaser.mp4" type="video/mp4" />

    <track id="track-en" label="English" kind="subtitles"
           srclang="en" src="sample/sample_en.vtt" />

    <track id="track-ko" label="Korean" kind="subtitles"
           srclang="ko" src="sample/sample_ko.vtt" default />
  </video>

  <!-- 클릭 차단 -->
  <div id="video-click-blocker"></div>

  <!-- 자막 전환 -->
  <div id="subtitle-touch-layer"></div>

</div>

<script src="script.js"></script>
</body>
</html>
