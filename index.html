<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Interactive Subtitle Switch Player</title>

  <style>
    body {
      margin: 0;
      background: #111;
      color: white;
      font-family: Arial, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    h1 {
      margin-top: 24px;
      margin-bottom: 16px;
    }

    /* 🎥 16:9 비율 유지 */
    .video-wrapper {
      position: relative;
      width: 90%;
      max-width: 800px;
      aspect-ratio: 16 / 9;
      background: black;
      border-radius: 12px;
      overflow: hidden;
    }

    video {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
      background: black;
      z-index: 1;
    }

    /* 💬 자막 터치 레이어 – 영상 아래쪽 부분만 덮기 */
    #subtitle-touch-layer {
      position: absolute;
      left: 0;
      right: 0;
      bottom: 12%;   /* 컨트롤바 위에 살짝 띄워둠 */
      height: 30%;   /* 자막이 나오는 대략적인 영역 */
      z-index: 2;
      pointer-events: auto;
      /* 디버깅용: 필요하면 잠깐 켜서 위치 확인
      background: rgba(0, 255, 0, 0.15);
      */
    }

    #uploader {
      margin-top: 20px;
      padding: 16px;
      background: #222;
      border-radius: 10px;
      width: 90%;
      max-width: 800px;
      box-sizing: border-box;
      font-size: 14px;
    }

    #uploader h2 {
      margin: 0 0 10px;
      font-size: 16px;
    }

    #uploader label {
      display: block;
      margin: 6px 0 2px;
    }

    #uploader input[type="file"] {
      width: 100%;
      margin-bottom: 8px;
    }
  </style>
</head>

<body>
  <h1>Interactive Subtitle Switch Player</h1>

  <div class="video-wrapper">
    <video id="video" controls>
      <source src="sample/sample_teaser.mp4" type="video/mp4" />

      <!-- 기본: 한국어 자막 -->
      <track
        id="track-en"
        label="English"
        kind="subtitles"
        srclang="en"
        src="sample/sample_en.vtt"
      />
      <track
        id="track-ko"
        label="Korean"
        kind="subtitles"
        srclang="ko"
        src="sample/sample_ko.vtt"
        default
      />
    </video>

    <!-- 자막 홀드/해제 영역 -->
    <div id="subtitle-touch-layer"></div>
  </div>

  <div id="uploader">
    <h2>Use Your Own Video / Subtitles</h2>

    <label for="upload-video">🎬 Upload Video</label>
    <input type="file" id="upload-video" accept="video/*" />

    <label for="upload-en">🇺🇸 Upload English Subtitle (.vtt)</label>
    <input type="file" id="upload-en" accept=".vtt" />

    <label for="upload-ko">🇰🇷 Upload Korean Subtitle (.vtt)</label>
    <input type="file" id="upload-ko" accept=".vtt" />
  </div>

  <script src="script.js"></script>
</body>
</html>
