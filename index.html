<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Interactive Subtitle Switch Player</title>

  <style>
    body {
      margin: 0;
      background: #111;
      color: white;
      font-family: Arial, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    h1 {
      margin-top: 24px;
      margin-bottom: 16px;
    }

    /* 🎥 영상 영역 (검은 바 제거 완료) */
    .video-wrapper {
      position: relative;
      width: 90%;
      max-width: 800px;
      border-radius: 12px 12px 0 0;
      overflow: hidden;
      background: black;
    }

    video {
      width: 100%;
      height: auto; /* 검은 바 사라지게 하는 핵심 */
      object-fit: cover;
      background: black;
      display: block;
    }

    /* 자막 스타일 */
    .subtitle {
      position: absolute;
      bottom: 40px;
      width: 100%;
      text-align: center;
      font-size: 20px;
      background: rgba(0,0,0,0.6);
      padding: 6px 12px;
      border-radius: 6px;
      pointer-events: none;
    }

    /* 업로드 섹션 */
    .upload-section {
      width: 90%;
      max-width: 800px;
      background: #333;
      padding: 20px;
      margin-top: 8px;
      border-radius: 10px;
    }

    .upload-section h2 {
      margin-bottom: 12px;
      font-size: 20px;
    }

    .upload-item {
      margin-bottom: 16px;
    }
  </style>
</head>

<body>

  <h1>Interactive Subtitle Switch Player</h1>

  <div class="video-wrapper">
    <video id="video" controls crossorigin="anonymous">
      <source id="videoSource" src="" type="video/mp4" />
    </video>

    <div id="subtitleBox" class="subtitle" style="display:none;"></div>
  </div>

  <p style="margin-top:10px; color:#bbb;">
    자막 줄을 콕 누르면 영어, 데번 한국어
  </p>

  <div class="upload-section">
    <h2>Use Your Own Video / Subtitles</h2>

    <div class="upload-item">
      📁 <strong>Upload Video</strong><br />
      <input type="file" id="videoUpload" accept="video/mp4,video/webm" />
    </div>

    <div class="upload-item">
      🇺🇸 <strong>Upload English Subtitle (.vtt)</strong><br />
      <input type="file" id="engSubUpload" accept=".vtt" />
    </div>

    <div class="upload-item">
      🇰🇷 <strong>Upload Korean Subtitle (.vtt)</strong><br />
      <input type="file" id="korSubUpload" accept=".vtt" />
    </div>
  </div>

  <script>
    const video = document.getElementById("video");
    const subtitleBox = document.getElementById("subtitleBox");

    let engSubs = [];
    let korSubs = [];
    let activeSubs = null;

    // 파일 업로드 핸들러
    document.getElementById("videoUpload").addEventListener("change", function () {
      const file = this.files[0];
      if (file) {
        const url = URL.createObjectURL(file);
        document.getElementById("videoSource").src = url;
        video.load();
      }
    });

    document.getElementById("engSubUpload").addEventListener("change", async function () {
      const text = await this.files[0].text();
      engSubs = parseVTT(text);
      activeSubs = engSubs;
    });

    document.getElementById("korSubUpload").addEventListener("change", async function () {
      const text = await this.files[0].text();
      korSubs = parseVTT(text);
    });

    // VTT 파서
    function parseVTT(vttText) {
      const lines = vttText.split("\n");
      const cues = [];

      let start = null, end = null, text = "";

      for (let line of lines) {
        line = line.trim();

        if (line.includes("-->")) {
          const parts = line.split("-->");
          start = toSeconds(parts[0]);
          end = toSeconds(parts[1]);
        } else if (line === "") {
          if (start !== null && text !== "") {
            cues.push({ start, end, text });
            start = null;
            end = null;
            text = "";
          }
        } else if (!line.startsWith("WEBVTT")) {
          text += (text ? "\n" : "") + line;
        }
      }

      return cues;
    }

    function toSeconds(timeStr) {
      const parts = timeStr.trim().split(":");
      const sec = parseFloat(parts.pop());
      const min = parseFloat(parts.pop());
      const hr = parts.length ? parseFloat(parts.pop()) : 0;
      return hr * 3600 + min * 60 + sec;
    }

    // 영상 재생에 따라 자막 업데이트
    video.addEventListener("timeupdate", () => {
      if (!activeSubs) return;

      const t = video.currentTime;
      const cue = activeSubs.find(c => t >= c.start && t <= c.end);

      if (cue) {
        subtitleBox.innerHTML = cue.text;
        subtitleBox.style.display = "block";
      } else {
        subtitleBox.style.display = "none";
      }
    });

    // 자막 박스를 클릭하면 영어 ↔ 한국어 전환
    subtitleBox.addEventListener("click", () => {
      if (activeSubs === engSubs && korSubs.length > 0) {
        activeSubs = korSubs;
      } else if (engSubs.length > 0) {
        activeSubs = engSubs;
      }
    });
  </script>

</body>
</html>
