<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Interactive Subtitle Switch Player</title>

  <style>
    body {
      margin: 0;
      background: #111;
      color: white;
      font-family: Arial, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    h1 {
      margin-top: 24px;
      margin-bottom: 16px;
    }

    /* 🎥 16:9 영상 영역 */
    .video-wrapper {
      position: relative;
      width: 90%;
      max-width: 800px;
      aspect-ratio: 16 / 9;
      border-radius: 12px 12px 0 0;
      overflow: hidden;
      background: black;
    }

    video {
      width: 100%;
      height: 100%;
      object-fit: cover;
      background: black;
    }

    /* ❗ Safari 자막이 사라지는 문제 해결: video::cue 삭제 */

    /* 💬 영상 아래 자막 표시 바 */
    #subtitle-bar {
      width: 90%;
      max-width: 800px;
      min-height: 2.4em;
      background: #000;
      border-radius: 0 0 12px 12px;
      padding: 6px 12px;
      text-align: center;
      font-size: 1rem;
      line-height: 1.3;
      color: #fff;
      text-shadow: 0 0 4px #000;
      user-select: none;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    #subtitle-bar span {
      background: rgba(0, 0, 0, 0.5);
      padding: 4px 8px;
      border-radius: 4px;
    }

    #hint {
      margin-top: 4px;
      font-size: 12px;
      color: #aaa;
    }

    /* 업로드 영역 */
    #uploader {
      margin-top: 20px;
      background: #222;
      padding: 16px;
      width: 90%;
      max-width: 800px;
      border-radius: 10px;
      box-sizing: border-box;
    }

    #uploader h2 {
      margin: 0 0 10px;
      font-size: 16px;
    }

    #uploader label {
      display: block;
      margin: 6px 0 2px;
    }

    #uploader input {
      width: 100%;
      margin-bottom: 8px;
    }
  </style>
</head>

<body>
  <h1>Interactive Subtitle Switch Player</h1>

  <div class="video-wrapper">
    <video id="video" controls>
      <source src="sample/sample_teaser.mp4" type="video/mp4" />

      <!-- 브라우저 기본 자막 렌더링용 -->
      <track id="track-en" label="English" kind="subtitles" srclang="en" src="sample/sample_en.vtt">
      <track id="track-ko" label="Korean" kind="subtitles" srclang="ko" src="sample/sample_ko.vtt">
    </video>
  </div>

  <!-- 영상 아래 자막 바 -->
  <div id="subtitle-bar"><span></span></div>
  <div id="hint">자막 줄을 꾹 누르면 영어, 떼면 한국어</div>

  <!-- 업로드 영역 -->
  <div id="uploader">
    <h2>Use Your Own Video / Subtitles</h2>

    <label>🎬 Upload Video</label>
    <input type="file" id="upload-video" accept="video/*">

    <label>🇺🇸 Upload English Subtitle (.vtt)</label>
    <input type="file" id="upload-en" accept=".vtt">

    <label>🇰🇷 Upload Korean Subtitle (.vtt)</label>
    <input type="file" id="upload-ko" accept=".vtt">
  </div>

  <script src="script.js"></script>
</body>
</html>
