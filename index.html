<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Interactive Subtitle Switch Player</title>

  <style>
    body {
      margin: 0;
      background: #111;
      color: white;
      font-family: Arial, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    h1 {
      margin-top: 24px;
      margin-bottom: 16px;
    }

    /* 🎥 16:9 비율 유지 */
    .video-wrapper {
      position: relative;
      width: 90%;
      max-width: 800px;
      aspect-ratio: 16 / 9;
      background: black;
      border-radius: 12px;
      overflow: hidden;
    }

    video {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
      background: black;
      z-index: 1;
    }

    /* 💬 우리가 직접 그리는 자막 박스 (클릭 가능) */
    #subtitle-overlay {
      position: absolute;
      left: 5%;
      right: 5%;
      bottom: 12%;      /* 컨트롤바 위에 위치 */
      min-height: 2.4em;
      z-index: 2;
      text-align: center;
      font-size: 1rem;
      line-height: 1.4;
      color: #fff;
      text-shadow: 0 0 4px #000, 0 0 8px #000;
      display: flex;
      align-items: center;
      justify-content: center;
      pointer-events: auto;
      /* 디버깅용 배경
      background: rgba(0,0,0,0.3);
      */
    }

    #subtitle-overlay span {
      background: rgba(0, 0, 0, 0.5);
      padding: 4px 8px;
      border-radius: 4px;
    }

    #uploader {
      margin-top: 20px;
      padding: 16px;
      background: #222;
      border-radius: 10px;
      width: 90%;
      max-width: 800px;
      box-sizing: border-box;
      font-size: 14px;
    }

    #uploader h2 {
      margin: 0 0 10px;
      font-size: 16px;
    }

    #uploader label {
      display: block;
      margin: 6px 0 2px;
    }

    #uploader input[type="file"] {
      width: 100%;
      margin-bottom: 8px;
    }
  </style>
</head>

<body>
  <h1>Interactive Subtitle Switch Player</h1>

  <div class="video-wrapper">
    <video id="video" controls>
      <source src="sample/sample_teaser.mp4" type="video/mp4" />

      <!-- 데이터용 트랙 (render 안 함) -->
      <track
        id="track-en"
        label="English"
        kind="subtitles"
        srclang="en"
        src="sample/sample_en.vtt"
      />
      <track
        id="track-ko"
        label="Korean"
        kind="subtitles"
        srclang="ko"
        src="sample/sample_ko.vtt"
      />
    </video>

    <!-- 커스텀 자막 + 터치 영역 -->
    <div id="subtitle-overlay"></div>
  </div>

  <div id="uploader">
    <h2>Use Your Own Video / Subtitles</h2>

    <label for="upload-video">🎬 Upload Video</label>
    <input type="file" id="upload-video" accept="video/*" />

    <label for="upload-en">🇺🇸 Upload English Subtitle (.vtt)</label>
    <input type="file" id="upload-en" accept=".vtt" />

    <label for="upload-ko">🇰🇷 Upload Korean Subtitle (.vtt)</label>
    <input type="file" id="upload-ko" accept=".vtt" />
  </div>

  <script src="script.js"></script>
</body>
</html>
