<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Interactive Dual Subtitle Player</title>
    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #111;
            color: white;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        h1 {
            margin-top: 20px;
            margin-bottom: 10px;
        }

        video {
            width: 90%;
            max-width: 800px;
            margin-top: 20px;
            background: black;
            border-radius: 10px;
        }

        #uploader {
            margin-top: 25px;
            padding: 15px;
            background: #222;
            border-radius: 10px;
            text-align: center;
        }

        #uploader label {
            display: block;
            margin-bottom: 8px;
        }

        #uploader input {
            margin-bottom: 10px;
        }
    </style>
</head>

<body>
    <h1>Interactive Dual Subtitle Player</h1>

    <!-- 🔥 기본 영상 + 자막 -->
    <video id="video" controls>
        <source src="sample/sample_teaser.mp4" type="video/mp4" />
        <track id="track-en" label="English" kind="subtitles" srclang="en" src="sample/sample_en.vtt">
        <track id="track-ko" label="Korean" kind="subtitles" srclang="ko" src="sample/sample_ko.vtt" default>
    </video>

    <!-- 🔥 업로드 기능 -->
    <div id="uploader">
        <label>🎬 Upload Your Own Video</label>
        <input type="file" id="upload-video" accept="video/*" /><br />

        <label>🇺🇸 Upload English Subtitle (.vtt)</label>
        <input type="file" id="upload-en" accept=".vtt" /><br />

        <label>🇰🇷 Upload Korean Subtitle (.vtt)</label>
        <input type="file" id="upload-ko" accept=".vtt" />
    </div>

    <!-- 🔥 스크립트 -->
    <script src="script.js"></script>

</body>
</html>
